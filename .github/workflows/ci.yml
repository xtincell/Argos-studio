name: Argos CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          ANTHROPIC_API_KEY: ''
          DOTENV_CONFIG_PATH: /dev/null
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:/tmp/argos-ci-build.db
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node -e "require('node:fs').writeFileSync('/tmp/argos-ci-build.db', '')"
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: node tests/production-flow.mjs
      # Interface receipt on the built server: errors, keyboard/focus, 390 px, freshness.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  # Container image for the owner's VPS (arbitrage 5.8): built, then received on a volume:
  # public reads, single administration key, library kept across restart and recreation.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://argos.example.org -t argos-studio:ci .
      - run: docker/recette.sh argos-studio:ci argos-ci- 3990
